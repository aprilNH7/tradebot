<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeBot Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0e17;
            color: #e1e5ee;
            padding: 20px;
        }
        h1 { color: #00d4aa; margin-bottom: 20px; font-size: 1.8rem; }
        h2 { color: #8892b0; margin-bottom: 10px; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card {
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 20px;
        }
        .stat { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1e293b; }
        .stat:last-child { border-bottom: none; }
        .stat-label { color: #8892b0; }
        .stat-value { font-weight: 600; }
        .positive { color: #00d4aa; }
        .negative { color: #ff6b6b; }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .badge-buy { background: rgba(0, 212, 170, 0.2); color: #00d4aa; }
        .badge-sell { background: rgba(255, 107, 107, 0.2); color: #ff6b6b; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 10px; color: #8892b0; border-bottom: 2px solid #1e293b; font-size: 0.85rem; }
        td { padding: 10px; border-bottom: 1px solid #1e293b; font-size: 0.9rem; }
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .status-running { background: #00d4aa; box-shadow: 0 0 6px #00d4aa; }
        .status-stopped { background: #ff6b6b; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; }
        .refresh-info { color: #4a5568; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>TradeBot Dashboard</h1>
        <div>
            <span id="status-indicator"></span>
            <span class="refresh-info">Auto-refresh: 5s</span>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <h2>Performance</h2>
            <div id="performance-stats"></div>
        </div>
        <div class="card">
            <h2>Risk Management</h2>
            <div id="risk-stats"></div>
        </div>
        <div class="card">
            <h2>Exchanges</h2>
            <div id="exchange-stats"></div>
        </div>
        <div class="card">
            <h2>Strategy Breakdown</h2>
            <div id="strategy-stats"></div>
        </div>
    </div>

    <div class="card">
        <h2>Recent Trades</h2>
        <table>
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Symbol</th>
                    <th>Side</th>
                    <th>Qty</th>
                    <th>Entry</th>
                    <th>Exit</th>
                    <th>PnL</th>
                    <th>Strategy</th>
                </tr>
            </thead>
            <tbody id="trades-table"></tbody>
        </table>
    </div>

    <script>
        function renderStats(containerId, data) {
            const el = document.getElementById(containerId);
            el.innerHTML = Object.entries(data).map(([k, v]) => {
                let cls = '';
                if (typeof v === 'string') {
                    if (v.includes('+') || (v.startsWith('$') && !v.startsWith('$-'))) cls = 'positive';
                    if (v.startsWith('$-') || v.startsWith('-')) cls = 'negative';
                }
                return `<div class="stat"><span class="stat-label">${k.replace(/_/g, ' ')}</span><span class="stat-value ${cls}">${v}</span></div>`;
            }).join('');
        }

        async function refresh() {
            try {
                const [status, perf, risk, trades, strategies] = await Promise.all([
                    fetch('/api/status').then(r => r.json()),
                    fetch('/api/performance').then(r => r.json()),
                    fetch('/api/risk').then(r => r.json()),
                    fetch('/api/trades').then(r => r.json()),
                    fetch('/api/strategies').then(r => r.json()),
                ]);

                // Status indicator
                const dot = document.getElementById('status-indicator');
                dot.innerHTML = `<span class="status-dot ${status.running ? 'status-running' : 'status-stopped'}"></span>${status.running ? 'Running' : 'Stopped'}`;

                renderStats('performance-stats', perf);
                renderStats('risk-stats', risk);
                renderStats('exchange-stats', status.exchanges || {});

                // Strategies
                const stratEl = document.getElementById('strategy-stats');
                if (Object.keys(strategies).length) {
                    stratEl.innerHTML = Object.entries(strategies).map(([name, s]) =>
                        `<div class="stat"><span class="stat-label">${name}</span><span class="stat-value">${s.trades} trades | $${s.pnl.toFixed(2)} | ${s.trades ? (s.wins/s.trades*100).toFixed(0) : 0}% win</span></div>`
                    ).join('');
                } else {
                    stratEl.innerHTML = '<div class="stat"><span class="stat-label">No data yet</span></div>';
                }

                // Trades table
                const tbody = document.getElementById('trades-table');
                tbody.innerHTML = trades.reverse().slice(0, 20).map(t => `
                    <tr>
                        <td>${new Date(t.entry_time).toLocaleString()}</td>
                        <td><strong>${t.symbol}</strong></td>
                        <td><span class="badge ${t.side === 'BUY' ? 'badge-buy' : 'badge-sell'}">${t.side}</span></td>
                        <td>${t.quantity.toFixed(4)}</td>
                        <td>$${t.entry_price.toFixed(4)}</td>
                        <td>${t.exit_price ? '$' + t.exit_price.toFixed(4) : '—'}</td>
                        <td class="${t.pnl >= 0 ? 'positive' : 'negative'}">$${t.pnl.toFixed(2)}</td>
                        <td>${t.strategy}</td>
                    </tr>
                `).join('');

            } catch (e) {
                console.error('Refresh failed:', e);
            }
        }

        refresh();
        setInterval(refresh, 5000);
    </script>
</body>
</html>
